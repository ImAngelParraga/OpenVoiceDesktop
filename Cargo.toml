[package]
name = "openvoice-desktop"
version = "0.1.16"
edition = "2021"
description = "Resident desktop dictation client for OpenVoice-compatible ASR services"
license = "MIT"
repository = "https://github.com/ImAngelParraga/OpenVoiceDesktop"
homepage = "https://github.com/ImAngelParraga/OpenVoiceDesktop"

[features]
default = []
desktop-shell = ["dep:tauri", "dep:tauri-plugin-single-instance"]

[[bin]]
name = "openvoice-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
dirs = "5.0"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tauri = { version = "2.11.5", optional = true , features = [] }
tauri-plugin-single-instance = { version = "2.4.2", optional = true }
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
unicode-segmentation = "1.12"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target.'cfg(windows)'.dependencies]
arboard = "3.4"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
