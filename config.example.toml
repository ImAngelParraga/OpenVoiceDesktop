schema_version = 1

[asr]
base_url = "http://127.0.0.1:9000"
model = "whisper-1"
timeout_seconds = 30
# language = "en"
# prompt = "Optional vocabulary or formatting hint"
# Prefer OPENVOICE_DESKTOP_TOKEN or Secret Service instead of plaintext.
# bearer_token = "replace-with-dev-token-only"

[audio]
sample_rate_hz = 16000
channels = 1
# selected_microphone = "default"
mute_while_recording = false
audio_feedback = false
# selected_output_device = "default"
audio_feedback_volume = 0.5

[behavior]
restore_clipboard = true
clipboard_restore_delay_ms = 250
shortcut = "Ctrl+Alt+Space"
push_to_talk = false
cancel_shortcut = "Escape"
