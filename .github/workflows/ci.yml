name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --features desktop-shell

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'openvoice-desktop').version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "release tag ${{ github.ref_name }} does not match Cargo version v$version"
          }
      - name: Build NSIS setup
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: OpenVoiceDesktop_Windows_x64_installer
          args: --features desktop-shell --bundles nsis
      - name: Smoke test install, reinstall, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup executable was not produced" }
          ./scripts/test-installer.ps1 -InstallerPath $installer.FullName
      - name: Create installer checksum
        id: checksum
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'openvoice-desktop').version
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup executable was not produced" }
          $assetName = "OpenVoiceDesktop_${version}_x64-setup.exe"
          $checksum = "OpenVoiceDesktop_${version}_x64-setup.exe.sha256"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content $checksum -Encoding ascii
          "path=$checksum" >> $env:GITHUB_OUTPUT
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVoiceDesktop_Windows_x64_checksum
          path: ${{ steps.checksum.outputs.path }}
      - name: Upload checksum to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'openvoice-desktop').version
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $asset = "OpenVoiceDesktop_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $asset
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "OpenVoiceDesktop ${{ github.ref_name }}" --generate-notes --notes "Windows: download $asset and double-click it. This personal-use build is unsigned, so Windows SmartScreen may require confirmation. Ubuntu/Debian: download the .deb asset and install it with ``sudo apt install ./OpenVoiceDesktop_${version}_amd64.deb``."
          }
          gh release upload "${{ github.ref_name }}" $asset "${{ steps.checksum.outputs.path }}" --clobber

  linux-package:
    name: Build Linux package
    runs-on: ubuntu-latest
    # Serialized after the Windows job so only one job creates the release.
    needs: [test, windows-installer]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "openvoice-desktop") | .version')"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "release tag ${{ github.ref_name }} does not match Cargo version v$version" >&2
            exit 1
          fi
      - name: Build Debian package
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: OpenVoiceDesktop_Linux_amd64_package
          args: --features desktop-shell --bundles deb
      - name: Resolve package path
        id: package
        run: |
          package="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print | head -n 1)"
          if [ -z "$package" ]; then
            echo "Debian package was not produced" >&2
            exit 1
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Verify package payload
        run: ./scripts/verify-deb.sh "${{ steps.package.outputs.path }}"
      - name: Smoke test install, reinstall, and uninstall
        run: ./scripts/test-deb-install.sh "${{ steps.package.outputs.path }}"
      - name: Create package checksum
        id: checksum
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "openvoice-desktop") | .version')"
          asset="OpenVoiceDesktop_${version}_amd64.deb"
          checksum="$asset.sha256"
          cp "${{ steps.package.outputs.path }}" "$asset"
          sha256sum "$asset" > "$checksum"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=$checksum" >> "$GITHUB_OUTPUT"
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVoiceDesktop_Linux_amd64_checksum
          path: ${{ steps.checksum.outputs.path }}
      - name: Upload package to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "OpenVoiceDesktop ${{ github.ref_name }}" --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" "${{ steps.checksum.outputs.asset }}" "${{ steps.checksum.outputs.path }}" --clobber
