<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVoiceDesktop Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
    <script src="overlay.js" type="module"></script>
  </head>
  <body>
    <main id="overlay" aria-live="polite" hidden>
      <span id="message"></span>
      <span id="waveform" aria-hidden="true"></span>
      <button id="language" type="button" aria-label="Switch transcription language" title="Switch transcription language"></button>
      <button id="pause" type="button" aria-label="Pause recording" title="Pause recording">Ⅱ</button>
      <button id="cancel" type="button" aria-label="Cancel recording" title="Cancel recording"><span aria-hidden="true">×</span></button>
    </main>
  </body>
</html>
