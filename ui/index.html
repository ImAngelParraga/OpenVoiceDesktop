<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVoiceDesktop Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="settings.js" type="module"></script>
  </head>
  <body>
    <main>
      <aside aria-label="Settings sections">
        <h1>OpenVoiceDesktop</h1>
        <nav>
          <button class="active" data-section="general">General</button>
          <button data-section="asr">ASR Endpoint</button>
          <button data-section="advanced">Advanced</button>
          <button data-section="history">History</button>
          <button data-section="debug">Debug</button>
          <button data-section="about">About</button>
        </nav>
      </aside>
      <section id="content" tabindex="-1">
        <h2>General</h2>
        <p id="status" role="status" aria-live="polite">Loading settings…</p>
        <form id="settings-form"></form>
        <div class="save-actions">
          <button id="save" type="button" aria-busy="false">Save settings</button>
        </div>
        <div class="save-feedback">
          <p id="save-result" role="status" aria-live="polite"></p>
          <details id="save-details" hidden><summary>Details</summary><ul id="save-detail-list"></ul></details>
        </div>
      </section>
    </main>
  </body>
</html>
